[package]
name = "rbb-cli"
description = "Command-line bidding and corpus scoring for rusty-bidding-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rbb"
path = "src/main.rs"

[dependencies]
bridge-card.workspace = true
bidspec.workspace = true
rbb-engine.workspace = true
rbb-compare.workspace = true
rbb-assets.workspace = true
bridge-types.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }
rayon = "1"
# dealer3's script parser: `rbb deal check` reads a script as dealer3 will.
dealer-parser = { git = "https://github.com/bridge-craftwork/dealer3", rev = "24d6dbcb153f7e1d27c6bb75c1a967087f939c93" }
