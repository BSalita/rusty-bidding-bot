[package]
name = "rbb-cli"
description = "Command-line bidding and corpus scoring for rusty-bidding-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rbb"
path = "src/main.rs"

[dependencies]
bridge-card.workspace = true
bidspec.workspace = true
rbb-engine.workspace = true
rbb-compare.workspace = true
rbb-assets.workspace = true
bridge-types.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }
rayon = "1"
# dealer3: `rbb deal` reads a script with dealer3's parser and deals from it
# with dealer3's engine, so a script means here what it means there.
dealer-parser = { git = "https://github.com/bridge-craftwork/dealer3", rev = "045cbf03330787044b1240b9a9177d0d28750ca5" }
dealer-run = { git = "https://github.com/bridge-craftwork/dealer3", rev = "045cbf03330787044b1240b9a9177d0d28750ca5", features = ["parallel"] }
dealer-pbn = { git = "https://github.com/bridge-craftwork/dealer3", rev = "045cbf03330787044b1240b9a9177d0d28750ca5" }
